name: Build Guest Image

# Builds the pre-baked bladerunner guest image (PRD #45). Runs on every push
# to main that touches the build script, and on manual dispatch. Publishes
# artifacts to a GitHub Release tagged `guest-image-vYYYY.MM.DD`; same-day
# re-runs collapse onto the same tag.
#
# Notes on runners:
#  - amd64 builds run on `ubuntu-24.04`.
#  - arm64 builds run on `ubuntu-24.04-arm` (GitHub-hosted arm64). If that
#    image becomes unavailable, replace the matrix entry's `runs-on` with
#    `ubuntu-24.04` and let qemu-user emulation handle the foreign-arch
#    customisation; the build script already uses cross-arch-clean
#    Debian images and virt-customize so this is feasible.

on:
  push:
    branches: [main]
    paths:
      # The bake is Go now, so its inputs are the package that defines it and
      # the assets it installs. Bumping the Debian pin lives in basepins.sha512
      # inside that package, and is the change that most needs to rebuild.
      - internal/imagebuild/**
      - internal/provision/scripts/**
      - cmd/bladerunner/disk.go
      - .github/workflows/build-guest-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-utils libguestfs-tools curl coreutils

      - name: Resolve build metadata
        id: meta
        run: |
          BUILD_DATE="$(date -u +%Y.%m.%d)"
          echo "build_date=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"
          echo "tag=guest-image-v${BUILD_DATE}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        id: build
        run: |
          mkdir -p out
          OUT="out/bladerunner-guest-${{ matrix.arch }}.qcow2"
          go build -o bin/br ./cmd/bladerunner

          # bake writes its result into a user disk manifest, so it needs one.
          # Forking the builtin gives a per-arch disk with nothing else in it.
          sudo ./bin/br disk new ci-guest --from debian-trixie-gui

          # One mechanic exists — qemu-nbd + chroot — so there is nothing to
          # select. It used to be forced here with --method native, because
          # libguestfs 1.52 on the GitHub-hosted runners fails its appliance
          # network with "passt exited with status 1" (#45). That appliance was
          # never implemented in Go, so the flag has gone with it.
          sudo ./bin/br disk bake ci-guest \
            --arch ${{ matrix.arch }} \
            --output "${OUT}"

          # The sidecar the release publishes. bake reports the same digest on
          # stdout; recomputing it here keeps the file's format in one place.
          sudo chown "$(id -u):$(id -g)" "${OUT}"
          ( cd out && sha256sum "$(basename "${OUT}")" > "$(basename "${OUT}").sha256" )
          echo "out=${OUT}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bladerunner-guest-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.out }}
            ${{ steps.build.outputs.out }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifact layout
        run: |
          mkdir -p out
          find dist -type f \( -name '*.qcow2' -o -name '*.sha256' \) -exec cp -v {} out/ \;
          ls -la out/

      - name: Publish dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_DATE="${{ needs.build.outputs.build_date }}"
          TAG="guest-image-v${BUILD_DATE}"
          TITLE="Guest image ${BUILD_DATE}"

          # Collapse same-day rebuilds onto the same tag: delete + recreate.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} exists; updating assets"
            gh release upload "${TAG}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes "Pre-baked bladerunner guest image (Debian Trixie + Incus). Built ${BUILD_DATE}."
          fi

      - name: Update `guest-image-latest` pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="guest-image-latest"
          TITLE="Guest image (latest)"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes "Moving pointer to the most recent guest image build (${{ needs.build.outputs.build_date }})."
          fi
