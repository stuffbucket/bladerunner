name: Build Guest Image

# Builds the pre-baked bladerunner guest image (PRD #45). Runs on every push
# to main that touches the build script, and on manual dispatch. Publishes
# artifacts to a GitHub Release tagged `guest-image-vYYYY.MM.DD`; same-day
# re-runs collapse onto the same tag.
#
# Notes on runners:
#  - amd64 builds run on `ubuntu-24.04`.
#  - arm64 builds run on `ubuntu-24.04-arm` (GitHub-hosted arm64). If that
#    image becomes unavailable, replace the matrix entry's `runs-on` with
#    `ubuntu-24.04` and let qemu-user emulation handle the foreign-arch
#    customisation; the build script already uses cross-arch-clean
#    Debian images and virt-customize so this is feasible.

on:
  push:
    branches: [main]
    paths:
      # The bake is Go now, so its inputs are the package that defines it and
      # the assets it installs. Bumping the Debian pin lives in basepins.sha512
      # inside that package, and is the change that most needs to rebuild.
      - internal/imagebuild/**
      - internal/provision/scripts/**
      - cmd/bladerunner/disk.go
      - .github/workflows/build-guest-image.yml
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs. Two runs racing can otherwise both reach the release job, and
# an older one finishing late would clobber a newer one's images onto the
# `guest-image-latest` pointer that every fresh install downloads.
# cancel-in-progress stays false: a half-published release is worse than a
# redundant build.
concurrency:
  group: build-guest-image
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-utils libguestfs-tools curl coreutils

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          # Derive the identity from the COMMIT, not from the wall clock.
          #
          # `date -u` runs independently in each matrix leg, so a run straddling
          # UTC midnight gives amd64 and arm64 different dates — and since both
          # legs write this job output, the release job then receives whichever
          # finished last. That is a tag naming one day holding an image stamped
          # with another.
          #
          # The commit date is identical in both legs and identical on a re-run,
          # so the same commit always produces the same identity.
          BUILD_DATE="$(git show -s --format=%cd --date=format:'%Y.%m.%d' HEAD)"
          {
            echo "build_date=${BUILD_DATE}"
            echo "tag=guest-image-v${BUILD_DATE}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        id: build
        run: |
          mkdir -p out
          OUT="out/bladerunner-guest-${{ matrix.arch }}.qcow2"
          go build -o bin/br ./cmd/bladerunner

          # bake writes its result into a user disk manifest, so it needs one.
          # Forking the builtin gives a per-arch disk with nothing else in it.
          sudo ./bin/br disk new ci-guest --from debian-trixie-gui

          # One mechanic exists — qemu-nbd + chroot — so there is nothing to
          # select. It used to be forced here with --method native, because
          # libguestfs 1.52 on the GitHub-hosted runners fails its appliance
          # network with "passt exited with status 1" (#45). That appliance was
          # never implemented in Go, so the flag has gone with it.
          sudo ./bin/br disk bake ci-guest \
            --arch ${{ matrix.arch }} \
            --output "${OUT}"

          # The sidecar the release publishes. bake reports the same digest on
          # stdout; recomputing it here keeps the file's format in one place.
          sudo chown "$(id -u):$(id -g)" "${OUT}"
          ( cd out && sha256sum "$(basename "${OUT}")" > "$(basename "${OUT}").sha256" )
          echo "out=${OUT}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bladerunner-guest-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.out }}
            ${{ steps.build.outputs.out }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifact layout
        run: |
          mkdir -p out
          find dist -type f \( -name '*.qcow2' -o -name '*.sha256' \) -exec cp -v {} out/ \;
          ls -la out/

      - name: Publish dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_DATE="${{ needs.build.outputs.build_date }}"
          SHA="${{ needs.build.outputs.sha }}"
          TAG="guest-image-v${BUILD_DATE}"
          TITLE="Guest image ${BUILD_DATE}"
          MARKER="source-commit: ${SHA}"
          # Built with printf rather than inline in the --notes argument: a
          # multi-line string written inside this YAML block scalar carries the
          # block's indentation into the release body, which then defeats any
          # anchored match against the marker.
          NOTES="$(printf 'Pre-baked bladerunner guest image (Debian Trixie + Incus). Built %s.\n%s\n' \
            "${BUILD_DATE}" "${MARKER}")"

          # A dated tag is meant to name one immutable set of images. Same-day
          # rebuilds used to --clobber it unconditionally, so one tag could hold
          # images from two different commits over its lifetime and anyone who
          # downloaded it earlier had bytes nobody could reproduce.
          #
          # Re-running the SAME commit is still fine (it is a retry, and the
          # identity is now commit-derived so it lands on the same tag). A
          # DIFFERENT commit on the same day is refused: it needs its own
          # identity, not someone else's.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            existing="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""')"
            if echo "${existing}" | grep -qF "${MARKER}"; then
              echo "release ${TAG} is the same commit; refreshing assets"
              gh release upload "${TAG}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
            else
              echo "::error::${TAG} already exists and was built from a different commit." >&2
              echo "Existing release notes:" >&2
              echo "${existing}" >&2
              echo "Refusing to overwrite an immutable dated release." >&2
              exit 1
            fi
          else
            gh release create "${TAG}" out/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes "${NOTES}"
          fi

      - name: Update `guest-image-latest` pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_DATE="${{ needs.build.outputs.build_date }}"
          TAG="guest-image-latest"
          TITLE="Guest image (latest)"
          MARKER="points-at: ${BUILD_DATE}"
          # See the note on NOTES above: build it with printf so the YAML block
          # indentation does not leak into the release body and break the match.
          NOTES="$(printf 'Moving pointer to the most recent guest image build (%s).\n%s\n' \
            "${BUILD_DATE}" "${MARKER}")"

          # This pointer is what every fresh install downloads, so it must only
          # ever move FORWARD. The concurrency group above keeps runs in order,
          # but a re-dispatch of an older commit is still an ordinary mistake and
          # would silently hand new users an older image.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            current="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""' \
              | sed -n 's/^[[:space:]]*points-at:[[:space:]]*//p' | head -n1)"
            if [ -n "${current}" ] && [ "${current}" != "${BUILD_DATE}" ]; then
              older="$(printf '%s\n%s\n' "${BUILD_DATE}" "${current}" | sort -V | head -n1)"
              if [ "${older}" = "${BUILD_DATE}" ]; then
                echo "::error::Refusing to move ${TAG} back from ${current} to ${BUILD_DATE}." >&2
                exit 1
              fi
            fi
            gh release upload "${TAG}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes "${NOTES}"
          else
            gh release create "${TAG}" out/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes "${NOTES}"
          fi
