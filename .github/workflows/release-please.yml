name: Release

# Maximal-style release pipeline:
#   1. release-please maintains CHANGELOG + version and opens a release PR.
#      Merging it creates the vX.Y.Z tag + GitHub Release (notes from the
#      changelog).
#   2. goreleaser builds the signed (ad-hoc) `br` darwin/arm64 tarball +
#      checksums on a GitHub-hosted macOS runner and uploads them to the
#      release. CGO links Virtualization.framework, so this MUST run on macOS.
#   3. The source-controlled Homebrew formula (packaging/homebrew/bladerunner.rb)
#      is rendered with the release version + sha256 and synced into
#      stuffbucket/homebrew-tap, so `brew upgrade` tracks every release.
#
# All three live in one workflow gated on release-please's `release_created`
# output, so no cross-workflow dispatch / GITHUB_TOKEN anti-loop concerns.
#
# A fourth job dispatches publish-update-manifest.yml, which cannot be inlined:
# it waits up to 30 minutes for macos-builder's asynchronous upload. See the
# comment on that job.
#
# The signed + notarized .app DMG is built off-repo: macos-build (below) just
# triggers stuffbucket/macos-builder, which owns the runner + Apple secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Run JS actions (release-please-action) on the Node 24 runtime, not the
# deprecated Node 20. See github.blog deprecation-of-node-20-on-github-actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Trigger the signed + notarized Bladerunner.app DMG on the private builder
  # repo (stuffbucket/macos-builder), which owns the runner + Apple secrets.
  # No-ops until MACOS_BUILDER_PAT is set (onboarding) — see macos-build.yml.
  macos-build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/macos-build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Start the update-manifest pipeline for the release we just created.
  #
  # It has to be a dispatch. publish-update-manifest.yml also listens for
  # `release: published`, but that event cannot reach it: the release above is
  # created with GITHUB_TOKEN, and GitHub does not start workflow runs from
  # events generated with that token — see
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
  # ("events triggered by the GITHUB_TOKEN will not create a new workflow run"),
  # whose stated exceptions include workflow_dispatch. So the same token that
  # cannot raise a usable release event can still dispatch this.
  #
  # It is a dispatch rather than a `uses:` call because the target waits up to
  # 30 minutes for macos-builder's asynchronous upload, and a called workflow
  # would hold this run — and the release-${{ github.ref }} concurrency group —
  # for that whole time.
  update-manifest:
    name: Start the update manifest pipeline
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch publish-update-manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh workflow run publish-update-manifest.yml \
            --repo "${GITHUB_REPOSITORY}" --ref main -f "tag=${TAG}"
          echo "Dispatched the update manifest pipeline for ${TAG}."

  goreleaser:
    name: Build + attach CLI tarball (macOS)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-14
    outputs:
      # Whether the macOS tarball actually reached the release. The job itself
      # reports success when it skips, so downstream work cannot use its result
      # to decide — the Homebrew sync would go on to publish a formula pointing
      # at an asset that was never built.
      built: ${{ steps.mark.outputs.built }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # Guarded like the CI macOS job: skip with a warning rather than fail when
      # this is not a macOS host, so a runner that could not be allocated does
      # not fail a release that has already been tagged and published.
      #
      # The warning is louder here because the consequence is worse. CI skipping
      # leaves a commit unverified; this skipping leaves a PUBLISHED release with
      # no macOS CLI tarball on it, which users hit rather than developers. It is
      # recoverable — re-run this job against the existing tag — but only if
      # somebody notices, which is what the annotation is for.
      - name: Warn when this is not a macOS host
        if: runner.os != 'macOS'
        run: |
          echo "::warning title=macOS release artifact NOT built::runner.os=${{ runner.os }}. Release ${TAG} has been published WITHOUT its macOS CLI tarball. Re-run this job against tag ${TAG} on a macOS host to attach it."

      - uses: actions/checkout@v7
        if: runner.os == 'macOS'
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        if: runner.os == 'macOS'
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts (goreleaser, no publish)
        if: runner.os == 'macOS'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tarball + checksums to the release
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ls -la dist/
          gh release upload "$TAG" \
            dist/bladerunner_*_darwin_aarch64.tar.gz \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Set only after the upload succeeds, so this records that the asset is on
      # the release rather than that the job reached the end.
      - name: Mark the tarball as built
        id: mark
        if: runner.os == 'macOS'
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  homebrew:
    name: Sync Homebrew formula to the tap
    needs: [release-please, goreleaser]
    # Also requires the tarball to exist. goreleaser reports success when it
    # skips on a non-macOS host, so its result alone would let this publish a
    # formula whose download URL 404s.
    if: needs.release-please.outputs.release_created == 'true' && needs.goreleaser.outputs.built == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Render formula from the source-controlled template
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir /tmp --clobber
          ARCHIVE="bladerunner_${VERSION}_darwin_aarch64.tar.gz"
          SHA256="$(grep "$ARCHIVE" /tmp/checksums.txt | awk '{print $1}')"
          if [ -z "$SHA256" ]; then
            echo "::error::no sha256 for $ARCHIVE in checksums.txt"; cat /tmp/checksums.txt; exit 1
          fi
          sed -e "s/PLACEHOLDER_VERSION/${VERSION}/g" \
              -e "s/PLACEHOLDER_SHA256_DARWIN_ARM64/${SHA256}/" \
              packaging/homebrew/bladerunner.rb > /tmp/bladerunner.rb
          echo "Rendered formula:"; cat /tmp/bladerunner.rb

      - name: Push formula to stuffbucket/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret not set"; exit 1
          fi
          cd /tmp
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/stuffbucket/homebrew-tap.git"
          cp /tmp/bladerunner.rb homebrew-tap/Formula/bladerunner.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bladerunner.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged."
          else
            git commit -m "bladerunner ${TAG}"
            git push
          fi
