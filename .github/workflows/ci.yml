name: CI

on:
  push:
    branches: [main]
  # No branch filter. A PR that targets another feature branch (a stacked PR)
  # would otherwise get NO checks at all — `gh pr checks` reports "no checks
  # reported", which reads like a failure but is the trigger not matching. That
  # silently removes the CI signal from every PR above the base of a stack,
  # which is exactly where the riskiest changes tend to sit.
  pull_request:
  schedule:
    # Run weekly to catch new CVEs in existing deps
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: ${{ !env.ACT }}
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  # bladerunner only runs on macOS, but every other job here is ubuntu, so the
  # whole darwin half of the tree was never exercised by CI: 12 `//go:build
  # darwin` test files carrying 69 top-level tests — all of internal/vm, the
  # DiskArbitration suite, vmhost's unmount veto and most of cmd/bladerunner —
  # ran only on a developer's Mac. A GitHub macOS runner cannot start a VM (no
  # Virtualization.framework entitlement, no nested virt), so this runs with
  # -short, which is the switch AGENTS.md section 6.4 puts hardware tests
  # behind. That still covers every darwin unit test that does not need a VM.
  macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      # Every step below is guarded on actually being on a macOS host, so this
      # job SKIPS with a warning rather than failing when it is not. The
      # aggregate `check` job fails only on 'failure' or 'cancelled', so a skip
      # keeps pull requests unblocked — losing darwin coverage is worse than
      # nothing, but blocking every merge on a runner that could not be
      # allocated is worse still. One failed to allocate twice in a day here.
      #
      # The warning is the point. A silent skip would let the darwin half go
      # unbuilt for weeks behind a green tick, which is the failure this repo
      # keeps finding: a check whose coverage quietly became nothing.
      - name: Warn when this is not a macOS host
        if: runner.os != 'macOS'
        run: |
          echo "::warning title=macOS job skipped::runner.os=${{ runner.os }}, so the darwin build, unit tests and lint did NOT run. Darwin code is unverified for this commit."

      - uses: actions/checkout@v7
        if: runner.os == 'macOS'

      - name: Set up Go
        if: runner.os == 'macOS'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        if: runner.os == 'macOS'
        run: go build -v ./...

      - name: Test (short - hardware tests need a signed binary and a real VM)
        if: runner.os == 'macOS'
        run: go test -short -race ./...

      # golangci-lint analyses one build at a time, and the Lint job below runs
      # on Linux — so without this step no *_darwin.go file is ever linted in
      # CI, which is most of the VM, DiskArbitration and cartridge code. It runs
      # here rather than under GOOS=darwin on the Linux runner because the cgo
      # bridges need the macOS SDK to analyse at all. Mirrors `make lint`, whose
      # counterpart `make lint-linux` covers the other half locally.
      - name: golangci-lint (darwin build)
        if: runner.os == 'macOS'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          only-new-issues: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          only-new-issues: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run govulncheck
        run: ./scripts/govulncheck.sh

      - name: Run Trivy vulnerability scanner
        if: ${{ !env.ACT }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Required: with format=sarif, trivy-action *unsets* TRIVY_SEVERITY
          # unless this is 'true', so `severity` above is silently discarded and
          # `exit-code: 1` then trips on any finding at any severity — including
          # UNKNOWN-severity Go advisories that have no fix available (e.g.
          # GO-2026-5932, the x/crypto/openpgp "unmaintained" notice). That made
          # this job permanently red regardless of the declared HIGH,CRITICAL
          # policy. Trade-off: the SARIF uploaded to the Security tab is now
          # limited to HIGH,CRITICAL as well.
          limit-severities-for-sarif: 'true'
          # This is the production gate for the shipped Go binary + OS packages.
          # The ./site landing page is a separate static sub-project whose npm
          # deps are build-time tooling only (nothing ships at runtime); they are
          # validated by the pages.yml build job, so exclude its lockfile here.
          skip-files: 'site/package-lock.json'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !env.ACT && always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: 'trivy-results.sarif'

  check:
    name: check
    # Aggregator job: this is the single named status branch protection
    # (and repoman's REQUIRED_CHECK_NAME) gates on. Depends on the checks
    # that gate code correctness (build, lint). Security findings are
    # visible via the Security tab and the `security` job's status, but
    # don't gate routine PRs — upstream CVE drops shouldn't block
    # unrelated work, and govulncheck/trivy already upload SARIF.
    runs-on: ubuntu-latest
    needs: [build, lint, macos]
    if: always()
    steps:
      - name: Aggregate result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more upstream jobs failed or were cancelled"
            exit 1
          fi
          echo "All upstream jobs succeeded"
