name: Publish update manifest

# Bridge the delay between a release and its signed updater assets, then make
# the site publish the update manifest that `br self-update` reads from
# https://stuffbucket.github.io/bladerunner/latest.json.
#
# WHY THIS IS SEPARATE FROM THE RELEASE: the signed Bladerunner.app updater
# tarball is built OFF-REPO by stuffbucket/macos-builder, which uploads
# Bladerunner.app.tar.gz{,.sig} onto the release minutes to half an hour after
# the tag. release-please.yml only fires the builder and returns, so the assets
# are not there when it finishes. This job waits for them.
#
# WHY IT DOES NOT WRITE THE MANIFEST ITSELF: the manifest is derived state.
# pages.yml generates site/public/latest.json from the release list on every
# site build (cmd/update-manifest), so publishing the manifest IS deploying the
# site, and this job only has to ask for a deploy once the assets exist.
# Nothing commits latest.json: `main` requires the `check` status, and a commit
# made by github-actions[bot] inside a job carries no such status, so a push
# would be rejected however the workflow retried it.
#
# WHY release-please.yml DISPATCHES THIS: a `release: published` event cannot
# start it. Every release here is created with GITHUB_TOKEN, and GitHub does not
# start workflow runs from events generated with that token — see
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
# ("events triggered by the GITHUB_TOKEN will not create a new workflow run"),
# whose stated exceptions include workflow_dispatch, which is what
# release-please.yml uses. The release trigger below is kept for a release
# published by a human or an app token, and is restricted to product tags.
#
# GRACEFUL NO-OP: if the updater assets never appear (repo not onboarded to
# macos-builder, or the builder emitted no updater artifact) this exits 0 with a
# ::notice::, mirroring macos-build.yml. The site then publishes no latest.json
# and `br self-update` reports that there is no published update channel.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish the manifest for, e.g. v0.4.8"
        required: true
        type: string

permissions:
  contents: read
  # gh workflow run (dispatching pages.yml) needs this.
  actions: write

concurrency:
  group: publish-update-manifest
  cancel-in-progress: false

jobs:
  publish:
    name: Wait for the signed assets, then deploy
    # Product tags only. A guest-image-* release can never carry an updater
    # artifact, so a run for one could only ever wait and then no-op.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST_URL: https://stuffbucket.github.io/bladerunner/latest.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build the manifest tool
        run: go build -o "${RUNNER_TEMP}/update-manifest" ./cmd/update-manifest

      - name: Resolve the tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          # Shape check only; cmd/update-manifest holds the authoritative rule
          # for what counts as a product release tag.
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::'${TAG}' is not a product release tag (expected vMAJOR.MINOR.PATCH)." >&2
              exit 1
              ;;
          esac
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName > /dev/null; then
            echo "::error::No release is tagged ${TAG}." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Publishing the update manifest for ${TAG}"

      - name: Wait for the signed updater assets
        id: poll
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          POLL_MINUTES: "30"
          POLL_SECONDS: "30"
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/update-manifest"
          releases="${RUNNER_TEMP}/releases.json"
          deadline=$(( $(date +%s) + POLL_MINUTES * 60 ))
          ready=false
          while :; do
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate > "${releases}"
            # Prints the tag only when that one release can serve an update, so
            # an older publishable release cannot satisfy the wait for this one.
            if [ "$("${bin}" select -tag "${TAG}" < "${releases}")" = "${TAG}" ]; then
              echo "${TAG} carries its signed updater assets."
              ready=true
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::notice::The updater assets for ${TAG} did not appear within ${POLL_MINUTES} min — the repo may not be onboarded to macos-builder, or no updater artifact was emitted. Publishing no manifest."
              break
            fi
            echo "Waiting for the updater assets on ${TAG}…"
            sleep "${POLL_SECONDS}"
          done

          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"
          if [ "${ready}" != "true" ]; then
            exit 0
          fi

          # The manifest advertises the highest publishable release, which is
          # this one unless a newer one shipped while we waited. An empty answer
          # here would make the verification below compare nothing with nothing.
          expected="$("${bin}" select < "${releases}")"
          if [ -z "${expected}" ]; then
            echo "::error::No release can serve an update, although ${TAG} qualified a moment ago." >&2
            exit 1
          fi
          echo "expected_version=${expected#v}" >> "${GITHUB_OUTPUT}"

      - name: Deploy the site, which publishes the manifest
        if: steps.poll.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "Dispatched pages.yml; it regenerates latest.json from the releases."

      - name: Verify the manifest is live
        if: steps.poll.outputs.ready == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.poll.outputs.expected_version }}
          POLL_MINUTES: "20"
          POLL_SECONDS: "20"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + POLL_MINUTES * 60 ))
          while :; do
            # Bust the CDN cache: a stale copy would read as a failed deploy.
            got="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
              "${MANIFEST_URL}?t=$(date +%s)" | jq -r '.version // empty' || true)"
            if [ "${got}" = "${EXPECTED_VERSION}" ]; then
              echo "${MANIFEST_URL} advertises ${got}."
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::${MANIFEST_URL} advertises '${got}' after ${POLL_MINUTES} min; expected ${EXPECTED_VERSION}. Read the pages.yml run: it also refuses to replace a published manifest with an older one." >&2
              exit 1
            fi
            echo "Manifest still reads '${got}'; waiting for the deploy…"
            sleep "${POLL_SECONDS}"
          done
