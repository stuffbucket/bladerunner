# Bladerunner GRUB drop-in — SINGLE SOURCE OF TRUTH shared by the cloud-init
# path (internal/provision/cloudinit.go, written via write_files) and the
# pre-baked image build (scripts/build-guest-image.sh, --copy-in'd). It lands in
# /etc/default/grub.d/ and is sourced LAST (99_ prefix) so it overrides the
# distro defaults in /etc/default/grub and every lower-numbered drop-in.
# grub-mkconfig / update-grub must be re-run after installing it.

# Route the kernel console to hvc0 (the VZ-captured virtio serial device) AND
# tty0 (the GUI framebuffer), so a headless boot streams to the host-side
# console.log while a --gui boot renders the same output on screen. Appends to
# preserve any distro cmdline defaults rather than replacing them.
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX console=hvc0 console=tty0"

# Boot straight through — never park at the GRUB menu. Bladerunner is an
# appliance VM the operator drives entirely via `br`; a visible bootloader menu
# is a dead end they cannot act on (a headless boot has no keyboard focus, and a
# --gui boot just looks stuck). timeout 0 + hidden style skips the menu on a
# clean boot.
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden

# CRITICAL: neutralize Debian/Ubuntu "recordfail". Every `br stop`, host sleep,
# or crash is an unclean guest shutdown that sets recordfail=1 in grubenv. The
# distro default then re-shows the menu with an effectively unbounded timeout,
# waiting for a keypress that never arrives on an appliance VM — so the guest
# hangs at GRUB indefinitely and, to the user, looks like the whole disk is
# lost. Forcing the recordfail timeout to 0 makes the guest boot immediately
# regardless of the flag.
GRUB_RECORDFAIL_TIMEOUT=0
